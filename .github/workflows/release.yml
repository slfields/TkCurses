name: Release

# A tag v* is a release: the whole CI suite at that commit, then a build whose
# version must be exactly the tag's, then a GitHub release carrying the sdist
# and wheel, a zip of the documentation and a SHA256SUMS of all three - a
# pre-release for an rc, alpha or beta. GitHub only, not PyPI
# (TkCurses-2q6o.5, TkCurses-imii). The decisions are in
# .github/scripts/release.py, where tests/test_release_script.py can reach
# them without pushing a tag.
#
# Three jobs, so that the one that can write never runs anything it did not
# have to (security review TkCurses-tcbj.7). `build` and `docs` install and
# run third-party code - build backends, Sphinx and its themes - with a
# read-only token. `publish` alone may write, and it only downloads their
# artifacts, checks them against the sums `build` wrote, attests where they
# came from and uploads them: nothing installed there could alter a wheel
# that has already been checked.
#
# Run by hand (Actions > Release > Run workflow) it is a dry run: everything
# but the release itself, against a tag that need not exist yet - the build is
# of the chosen ref, so the version check is expected to fail unless that ref
# carries the tag. Use it to see the workflow work before the first real tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to rehearse, e.g. v0.3.0rc1"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and check
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # setuptools-scm counts from the tag, and a shallow clone has none.
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on master
        # A release is cut from reviewed work. Anyone who can push a tag can
        # push one on any commit; this is what stops one on an unmerged
        # branch from becoming a release.
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$TAG is on $GITHUB_SHA, which is not on master"
            exit 1
          fi
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/release.txt
      - run: python -m build --no-isolation
      - name: Check metadata
        run: twine check dist/*
      - name: The distributions are the tag's version
        # Skipped for a rehearsal of a tag that is not on this commit, which
        # is the usual reason to rehearse.
        if: github.event_name == 'push'
        run: python .github/scripts/release.py check "$TAG" dist
      - name: The wheel installs and runs
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/smoke/bin/python -I -c "
          import tkcurses
          from tkcurses import ttk, messagebox, filedialog, scrolledtext
          assert tkcurses.Entry and tkcurses.Text and ttk.Treeview
          print(tkcurses.__version__)"
      - name: Release notes
        run: |
          python .github/scripts/release.py notes "$TAG" CHANGELOG.md > dist-notes.md
          python .github/scripts/release.py prerelease "$TAG" > dist-prerelease.txt
          echo "--- notes for $TAG:"
          cat dist-notes.md
      - name: Checksums, as built
        run: (cd dist && sha256sum -- *) > dist.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: |
            dist/
            dist.sha256
            dist-notes.md
            dist-prerelease.txt
          if-no-files-found: error

  docs:
    name: Documentation zip
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The documentation, as a zip for the release
        # The same site docs.yml publishes, so every release carries its
        # documentation, whether or not Pages is switched on.
        run: |
          python -m pip install --require-hashes -r requirements/docs.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m sphinx -W --keep-going -b html docs docs/_build/html
          version=$(python -c "import importlib.metadata as m; print(m.version('tkcurses'))")
          mkdir -p release-extra
          (cd docs/_build && mv html "tkcurses-docs-$version" && zip -qr "../../release-extra/tkcurses-docs-$version.zip" "tkcurses-docs-$version")
          (cd release-extra && sha256sum -- *) > docs.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs
          path: |
            release-extra/
            docs.sha256
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [build, docs]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading its files.
      contents: write
      # Signing the build provenance, and recording it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs
      - name: The files are the ones that were built
        run: |
          (cd dist && sha256sum --strict -c ../dist.sha256)
          (cd release-extra && sha256sum --strict -c ../docs.sha256)
          cat dist.sha256 docs.sha256 > SHA256SUMS
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*
            release-extra/*
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--title "TkCurses $TAG" --verify-tag)
          if [ -s dist-notes.md ]; then
            flags+=(--notes-file dist-notes.md)
          else
            flags+=(--generate-notes)
          fi
          if [ "$(cat dist-prerelease.txt)" = true ]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" dist/* release-extra/* SHA256SUMS "${flags[@]}"
