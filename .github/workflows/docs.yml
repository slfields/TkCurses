name: Documentation

# Builds the Sphinx site with warnings as errors on every pull request, and
# from master publishes it to GitHub Pages. Until Pages is switched on
# (Settings > Pages > Source: GitHub Actions) and the repository variable
# DOCS_PAGES is set to "true", master's site is built and kept as an
# artifact, and the deploy is skipped rather than failed.
# Every release also carries the same site as a zip - release.yml.

on:
  # Every pull request, code included: the API reference is built from the
  # docstrings, so a code change can break the site. Only master deploys.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          # The version on every page comes from setuptools-scm.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/docs.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - name: The guides' programs, and the sample-output renderer
        # ci.yml skips a documentation-only change, so the tests that check
        # the pages against the library run here, where such a change is
        # built.
        run: python -m pytest -q -p no:cacheprovider tests/test_docs_tutorial.py tests/test_docs_porting.py tests/test_docs_terminals.py tests/test_examples.py tests/test_tkscreens.py tests/test_doc_aliases.py tests/test_configref.py tests/test_docs_cfg.py
      - name: Sphinx, with warnings as errors
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && vars.DOCS_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
