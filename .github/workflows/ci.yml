name: CI

on:
  # Every pull request, so the checks the master ruleset requires always
  # report. A change to documentation alone still runs no code checks
  # (decided with the user, TkCurses-imii): the "changes" job says so and
  # the code jobs are skipped, which counts as passing. paths-ignore did
  # this before, and a required check from a workflow that never started
  # would have kept such a pull request waiting for ever. TkCurses-tcbj.12.
  push:
    branches: [master]
  pull_request:
  # The release workflow runs all of this before it builds a release.
  workflow_call:

# Read-only, whatever the repository's default. The release workflow calls
# this with its own read-only token. Security review TkCurses-tcbj.10.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        # Through the environment, never as text in the script: a fork's
        # pull request writes some of these values.
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: python3 .github/scripts/code_changed.py >> "$GITHUB_OUTPUT"

  lint:
    name: Lint and type-check
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All of it: the version is counted from the last tag by
          # setuptools-scm, and a shallow clone has no tags to count from.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # Exactly what requirements/dev.txt locks, hashes checked, then the
      # project itself with no further downloads. TkCurses-tcbj.8.
      - run: pip install --require-hashes -r requirements/dev.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Test on Python ${{ matrix.python-version }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # Coverage on ONE interpreter. It is a number about the library, not
          # about the interpreter, so measuring it five times bought nothing -
          # and it is the most expensive thing in the job by a wide margin.
          # Measured locally, same tree, serial, 4318 tests:
          #
          #     without --cov   4:47
          #     with --cov     12:14      +156%
          #
          # because pytest-cov traces the forked children too: a full run
          # writes 587 coverage data files, one per process, and combines
          # them at the end. The tty tests fork a child each, which is what
          # makes this so much worse here than in an ordinary suite.
          #
          # 3.12 carries it, matching the interpreter the build job uses.
          # TkCurses-2gh.
          #
          # And it is held to a floor. The total, branch coverage, measured
          # on four master runs on 2026-11-17: 94.36, 94.41, 94.45 and
          # 94.50%. The tty tests' timing moves it by about a tenth from run
          # to run, so the floor sits under the lowest by more than that.
          # Raise it as the figure rises; lower it only for a reason written
          # here. The floor is on this command and not in pyproject.toml, so
          # `pytest --cov` on a few files locally is not failed for covering
          # a few files. TkCurses-us5p.4.
          - python-version: "3.12"
            coverage: "--cov --cov-report=term-missing --cov-fail-under=94"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All of it: the version is counted from the last tag by
          # setuptools-scm, and a shallow clone has no tags to count from.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install --require-hashes -r requirements/test.txt
      - run: pip install --no-deps --no-build-isolation -e .
      - name: Test
        # The suite drives real pseudo-terminals; runners provide them, but a
        # hung curses read would otherwise stall the job until the 6h limit.
        #
        # 20 and not 10, measured. This step takes 7.9-9.0 minutes on master
        # depending on the interpreter, so at 10 the slowest of them (3.14)
        # was running at 85% of its own limit and every pull request that
        # added a minute of tests failed on 3.14 for reasons that had nothing
        # to do with the change - which is what happened, and cost a round of
        # CI to diagnose. The job limit was never the thing protecting against
        # a hang anyway: pytest's own 60s per-test timeout is, as the note
        # below says. This one only has to be shorter than 6 hours.
        #
        # 40 and not 20, measured again on 2026-11-15: Python 3.12 runs the
        # suite under coverage several times slower than the others - its
        # tracer is what makes it slow, and that is left as it is - and its
        # step had grown to 15-20 minutes. Master's run of #7 passed every
        # test in 20:01 and failed on this limit, and the release workflow
        # calls this file, so a release would have failed the same way.
        timeout-minutes: 40
        env:
          # Every wait budget in the harness was chosen on a development
          # machine. A shared runner is several times slower - measured, a
          # tty test that takes 2.9s alone takes 5.5s under twelve-way
          # contention - and CI has timed out waiting for a child to exit on
          # runs where nothing was wrong with the code. A generous budget
          # costs nothing when the wait is going to succeed; it only changes
          # how long a doomed wait takes to say so, and pytest's own 60s
          # per-test timeout still backstops a genuine hang.
          TKCURSES_TEST_TIMEOUT_SCALE: "4"
        run: pytest ${{ matrix.coverage }}
      - name: Record the coverage total
        # In the run's summary, where a figure can be looked up later; the
        # term report scrolls by in a log of 15,000 tests.
        if: matrix.coverage && !cancelled()
        run: |
          {
            echo "### Coverage"
            echo
            echo "Branch coverage of src/tkcurses: $(coverage report --format=total)% (floor 94%)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build distributions
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All of it: the version is counted from the last tag by
          # setuptools-scm, and a shallow clone has no tags to count from.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/release.txt
      # The backend from the lock, not a fresh download: what the release
      # builds with, so this job tests that too.
      - run: python -m build --no-isolation
      - name: Check metadata
        run: twine check dist/*
      - name: An upgrade from git installs the new commit
        # TkCurses-2q6o.1: install, commit, pip install -U, look for the
        # commit's change in the installed copy.
        run: python tests/support/check_upgrade.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distributions
          path: dist/

  security:
    name: Security checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Static analysis of the library, and every lock file checked against
    # the advisories pip-audit knows. Security review TkCurses-tcbj.14.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/security.txt
      - name: Bandit
        # Medium severity and up. What it reports below that - asserts that
        # narrow types, the clipboard module importing subprocess - was
        # read in the review and is not a finding.
        run: bandit -r src --severity-level medium --quiet
      - name: Known vulnerabilities in what CI and the release install
        # One file at a time: given several, pip-audit refuses a package
        # pinned in more than one of them, and the locks share many.
        run: |
          status=0
          for lock in requirements/*.txt; do
            echo "::group::$lock"
            pip-audit --require-hashes --disable-pip --progress-spinner off \
              -r "$lock" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  passed:
    # The one check the master ruleset requires from this workflow: every
    # job above passed, or had nothing to check. Named once here, so a new
    # job or Python version needs no change to the ruleset.
    name: CI passed
    if: always()
    needs: [changes, lint, test, build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) exit 1 ;;
            esac
          done
