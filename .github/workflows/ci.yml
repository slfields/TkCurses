name: CI

on:
  push:
    branches: [master]
  pull_request:
  # The release workflow runs all of this before it builds a release.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All of it: the version is counted from the last tag by
          # setuptools-scm, and a shallow clone has no tags to count from.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Ruff lint
        run: ruff check --output-format=github .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Coverage on ONE interpreter. It is a number about the library, not
          # about the interpreter, so measuring it five times bought nothing -
          # and it is the most expensive thing in the job by a wide margin.
          # Measured locally, same tree, serial, 4318 tests:
          #
          #     without --cov   4:47
          #     with --cov     12:14      +156%
          #
          # because pytest-cov traces the forked children too: a full run
          # writes 587 coverage data files, one per process, and combines
          # them at the end. The tty tests fork a child each, which is what
          # makes this so much worse here than in an ordinary suite.
          #
          # 3.12 carries it, matching the interpreter the build job uses.
          # Nothing gates on the number - no fail_under, no upload - so the
          # other four jobs lose nothing by not computing it. TkCurses-2gh.
          - python-version: "3.12"
            coverage: "--cov --cov-report=term-missing"
    steps:
      - uses: actions/checkout@v4
        with:
          # All of it: the version is counted from the last tag by
          # setuptools-scm, and a shallow clone has no tags to count from.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - name: Test
        # The suite drives real pseudo-terminals; runners provide them, but a
        # hung curses read would otherwise stall the job until the 6h limit.
        #
        # 20 and not 10, measured. This step takes 7.9-9.0 minutes on master
        # depending on the interpreter, so at 10 the slowest of them (3.14)
        # was running at 85% of its own limit and every pull request that
        # added a minute of tests failed on 3.14 for reasons that had nothing
        # to do with the change - which is what happened, and cost a round of
        # CI to diagnose. The job limit was never the thing protecting against
        # a hang anyway: pytest's own 60s per-test timeout is, as the note
        # below says. This one only has to be shorter than 6 hours.
        timeout-minutes: 20
        env:
          # Every wait budget in the harness was chosen on a development
          # machine. A shared runner is several times slower - measured, a
          # tty test that takes 2.9s alone takes 5.5s under twelve-way
          # contention - and CI has timed out waiting for a child to exit on
          # runs where nothing was wrong with the code. A generous budget
          # costs nothing when the wait is going to succeed; it only changes
          # how long a doomed wait takes to say so, and pytest's own 60s
          # per-test timeout still backstops a genuine hang.
          TKCURSES_TEST_TIMEOUT_SCALE: "4"
        run: pytest ${{ matrix.coverage }}

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # All of it: the version is counted from the last tag by
          # setuptools-scm, and a shallow clone has no tags to count from.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - name: Check metadata
        run: twine check dist/*
      - name: An upgrade from git installs the new commit
        # TkCurses-2q6o.1: install, commit, pip install -U, look for the
        # commit's change in the installed copy.
        run: python tests/support/check_upgrade.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
