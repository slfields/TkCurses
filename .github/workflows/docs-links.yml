name: Documentation links

# Every external link in the documentation, checked weekly, by hand, and on a
# pull request that changes the docs. Kept out of ci.yml on purpose: a link
# check depends on other sites being up, and ci.yml gates every pull request
# and every release (TkCurses-imii.1).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs-links.yml"

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[docs]"
      - run: python -m sphinx -b linkcheck docs docs/_build/linkcheck
