name: Documentation links

# Every external link in the documentation, checked weekly, by hand, and on a
# pull request that changes the docs. Kept out of ci.yml on purpose: a link
# check depends on other sites being up, and ci.yml gates every pull request
# and every release (TkCurses-imii.1).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs-links.yml"

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/docs.txt
      - run: python -m pip install --no-deps --no-build-isolation .
      - run: python -m sphinx -b linkcheck docs docs/_build/linkcheck
