[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tkcurses"
version = "0.1.0"
description = "A tkinter-compatible API layer that renders to curses"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Scott L. Fields" },
]
keywords = ["tkinter", "curses", "tui", "terminal", "gui"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "pyte>=0.8",
]
dev = [
    "tkcurses[test]",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/slfields/TkCurses"
Repository = "https://github.com/slfields/TkCurses"
Issues = "https://github.com/slfields/TkCurses/issues"

[project.scripts]
tkcurses-demo = "tkcurses.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tkcurses = ["py.typed"]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
markers = [
    "tty: test drives a real pty and asserts on emulated terminal output",
    "slow: deselect with '-m \"not slow\"'",
]
# A hung curses call blocks on a pty read forever; fail the test instead of the suite.
timeout = 60

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.10"
files = ["src/tkcurses"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# pyte ships no type stubs.
[[tool.mypy.overrides]]
module = "pyte.*"
ignore_missing_imports = true

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length is enforced by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["tkcurses"]

[tool.ruff.lint.per-file-ignores]
# The public API deliberately mirrors tkinter's names and re-export surface.
"src/tkcurses/__init__.py" = ["F401", "F403"]
"tests/*" = ["ARG001", "ARG002"]

# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["src/tkcurses"]
branch = true
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]
