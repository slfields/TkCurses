[build-system]
# setuptools-scm takes the version from git, so that every commit has its own.
# A version written by hand stayed 0.1.0 through 330 commits, and pip, which
# compares versions, answered every "pip install -U git+..." with the code it
# already had. TkCurses-2q6o.1.
requires = ["setuptools>=77.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tkcurses"
dynamic = ["version"]
description = "A tkinter-compatible API layer that renders to curses"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
authors = [
    { name = "Scott L. Fields" },
]
keywords = ["tkinter", "curses", "tui", "terminal", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# The documentation site: Sphinx reading Markdown through MyST, the Furo
# theme. .github/workflows/docs.yml installs this extra to build the site.
docs = [
    "sphinx>=8.0",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
    # The sample outputs are drawn by running each example in a terminal
    # emulated by pyte, as the tests do - docs/_ext/tkscreens.py.
    "pyte>=0.8",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "pyte>=0.8",
    # An independent decoder to check ours against. Test-only on purpose:
    # the library itself takes no runtime dependency, and decoding PNG, GIF
    # and netpbm needs nothing beyond zlib. Pillow is here to disagree with
    # us when we are wrong, which is exactly how the XBM bit order was
    # caught - so the tests skip rather than fail when it is absent.
    "pillow>=10.0",
    # For tests/test_packaging.py, which asks it what a new commit's version
    # is. The build itself gets it from [build-system], not from here.
    "setuptools-scm>=8",
]
dev = [
    "tkcurses[test]",
    "pytest-xdist>=3.0",
    # Pinned to a minor series, not a floor. Ruff and mypy both add rules in
    # minor releases, so an open floor lets CI run a stricter checker than the
    # developer did and fail on code that was clean locally - which is exactly
    # how SIM910 reached master.
    #
    # mypy said <2, which is a *major* series and not what the paragraph
    # above describes: CI installed 1.20.2 against a developer's 1.19, and
    # failed on narrowing the older one did not do. The comment was right and
    # the constraint did not match it.
    "mypy>=1.19,<1.20",
    "ruff>=0.16,<0.17",
]
# Mutation testing, run by hand with tests/support/mutate.py; see TESTING.md.
# Not in dev: it brings a terminal UI toolkit and a parser CI never needs.
# Pinned to a minor series for the reason ruff and mypy are: its mutation
# operators change between releases, and a survivor list should mean the
# same thing to everyone reading it.
mutation = [
    "tkcurses[test]",
    "mutmut>=3.8,<3.9",
]

[project.urls]
Homepage = "https://github.com/slfields/TkCurses"
Repository = "https://github.com/slfields/TkCurses"
Issues = "https://github.com/slfields/TkCurses/issues"

[project.scripts]
tkcurses-demo = "tkcurses.__main__:main"
tkcurses-cfg = "tkcurses._cfg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tkcurses = ["py.typed"]

# The version is the latest tag, and past it the next one with a .devN that
# counts the commits since: 0.2.1.dev330+ge95dc81 on master after v0.2.0, so a
# merge is always newer than what came before it. A tagged commit is its tag
# alone. .git_archival.txt carries the same answer into a GitHub archive,
# which has no .git to ask.
[tool.setuptools_scm]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
# Python warns on os.fork() from a process that has threads, every time, and
# pytest-xdist's workers have threads - so a parallel run of the tty suite emits
# one of these per child, 684 of them, which would bury any warning worth
# reading. Silenced with a reason rather than left to be scrolled past.
#
# The HAZARD it warns about is real and is addressed separately: the forked child
# makes only async-signal-safe syscalls before it execs, which
# tests/test_harness.py checks mechanically. The warning cannot tell a child that
# execs immediately from one that allocates, so it fires either way.
# TkCurses-kwv.
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork.*:DeprecationWarning",
]
markers = [
    "tty: test drives a real pty and asserts on emulated terminal output",
    "slow: deselect with '-m \"not slow\"'",
]
# A hung curses call blocks on a pty read forever; fail the test instead of the suite.
timeout = 60

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.11"
# The library, and the tooling that measures and publishes it: the test
# harness and the recorders that write its reference data, the
# documentation extensions, and the release scripts. Not the tests
# themselves, the examples or the UAT scenarios, which are programs written
# the way a user would write them.
files = ["src/tkcurses", "tests/support", "docs/_ext", ".github/scripts"]
# Everything strict mode turns on, because measuring it cost nothing - the
# library already passed with no errors at all. The individual flags below
# were the subset chosen at the time, and the rest have been available for
# free ever since: disallow_any_generics, disallow_untyped_calls,
# disallow_subclassing_any and extra_checks are what strict adds to them.
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

# The documentation extensions import Sphinx and docutils. Sphinx is
# written for Python 3.12 and docutils ships no stubs, so mypy, checking for
# 3.11, stops inside them; and CI's lint job does not install either. The
# extensions are checked; what they import is taken as Any.
[[tool.mypy.overrides]]
module = ["sphinx.*", "docutils.*"]
follow_imports = "skip"
ignore_missing_imports = true

# pyte ships no type stubs.
[[tool.mypy.overrides]]
module = "pyte.*"
ignore_missing_imports = true

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]
# Ruff 0.16 formats fenced Python inside Markdown. ARCHITECTURE.md's snippets
# are specification sketches - some deliberately incomplete, some aligned for
# reading rather than for Black - so they are not the formatter's business.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length is enforced by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["tkcurses"]

[tool.ruff.lint.per-file-ignores]
# The public API deliberately mirrors tkinter's names and re-export surface.
"src/tkcurses/__init__.py" = ["F401", "F403"]
# filedialog's whole contract is os.path: it takes and returns path *strings*,
# splits them with os.path.split, compares against os.sep, os.curdir and
# os.pardir, and hands the result to callers written against tkinter's own
# module. Rewriting it round pathlib would mean converting at every boundary
# to produce the same strings, which is more code for the same behaviour and
# a worse match for what the module is.
"src/tkcurses/filedialog.py" = ["PTH"]
# The same, for the tests that check its path handling: they have to speak
# the os.path the module speaks to be checking anything.
"tests/test_filedialog.py" = ["PTH"]
# The examples are written as a reader would write a tkinter program: an
# event handler takes the event whether it reads it or not.
"examples/*.py" = ["ARG001", "ARG005"]
# And for the scenario that drives it, which passes the file dialogs the
# os.path strings they take.
"uat/scenario_30_choosers.py" = ["PTH"]
"tests/*" = ["ARG001", "ARG002", "ARG005"]
# Binding callbacks take an event whether or not they read it, and a trace
# takes three arguments it rarely wants all of. Same reason as the tests.
"uat/*" = ["ARG001", "ARG002", "ARG005"]

# ---------------------------------------------------------------- mutmut ----
# Run through tests/support/mutate.py, which runs mutmut in a worktree of the
# commit and sets only_mutate there to the modules asked about. Mutating them
# all is not just slow: each function becomes a copy per mutant, so
# __init__.py grows from 1 MB to 43 MB, every test imports it, and a test
# that caps its child at 512 MB runs out.
[tool.mutmut]
source_paths = ["src/"]
only_mutate = []
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = [
    "-p", "no:cacheprovider",
    # mutmut learns which tests reach a function by tracing them in its own
    # process, and a tty test reaches the library in a child it forks, so a
    # tty test is never chosen to kill a mutant. Leaving them out keeps the
    # tracing run to about a minute.
    "-m", "not tty",
    # About the repository rather than the library: they ask git about the
    # tree, and mutmut's copy of it is not a checkout - or, the last, read
    # this table, which mutate.py has just changed in that copy.
    "--ignore=tests/test_ci_changes.py",
    "--ignore=tests/test_hygiene.py",
    "--ignore=tests/test_licensing.py",
    "--ignore=tests/test_packaging.py",
    "--ignore=tests/test_suite_tests_its_own_tree.py",
    "--ignore=tests/test_uat_cfg_sandbox.py",
    "--ignore=tests/test_mutate_script.py",
]
# What the tests read besides src/ and tests/, which mutmut copies itself.
also_copy = [
    ".github/",
    "docs/",
    "examples/",
    "requirements/",
    "uat/",
    ".gitattributes",
    ".gitignore",
    "ARCHITECTURE.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "TESTING.md",
    "THIRD_PARTY_NOTICES.md",
]

# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["src/tkcurses"]
branch = true
omit = ["*/__main__.py"]
# The tty suite runs application code in forked child processes; without these
# every line exercised only through the harness reads as uncovered.
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
# Two places, so the total is printed as the figure CI's --cov-fail-under
# compares: at the default of none, anything from 93.5 up reads as "94%".
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]
