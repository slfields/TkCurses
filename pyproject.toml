[build-system]
# setuptools-scm takes the version from git, so that every commit has its own.
# A version written by hand stayed 0.1.0 through 330 commits, and pip, which
# compares versions, answered every "pip install -U git+..." with the code it
# already had. TkCurses-2q6o.1.
requires = ["setuptools>=77.0", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tkcurses"
dynamic = ["version"]
description = "A tkinter-compatible API layer that renders to curses"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [
    { name = "Scott L. Fields" },
]
keywords = ["tkinter", "curses", "tui", "terminal", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-timeout>=2.0",
    "hypothesis>=6.0",
    "pyte>=0.8",
    # An independent decoder to check ours against. Test-only on purpose:
    # the library itself takes no runtime dependency, and decoding PNG, GIF
    # and netpbm needs nothing beyond zlib. Pillow is here to disagree with
    # us when we are wrong, which is exactly how the XBM bit order was
    # caught - so the tests skip rather than fail when it is absent.
    "pillow>=10.0",
    # For tests/test_packaging.py, which asks it what a new commit's version
    # is. The build itself gets it from [build-system], not from here.
    "setuptools-scm>=8",
]
dev = [
    "tkcurses[test]",
    "pytest-xdist>=3.0",
    # Pinned to a minor series, not a floor. Ruff and mypy both add rules in
    # minor releases, so an open floor lets CI run a stricter checker than the
    # developer did and fail on code that was clean locally - which is exactly
    # how SIM910 reached master.
    #
    # mypy said <2, which is a *major* series and not what the paragraph
    # above describes: CI installed 1.20.2 against a developer's 1.19, and
    # failed on narrowing the older one did not do. The comment was right and
    # the constraint did not match it.
    "mypy>=1.19,<1.20",
    "ruff>=0.16,<0.17",
]

[project.urls]
Homepage = "https://github.com/slfields/TkCurses"
Repository = "https://github.com/slfields/TkCurses"
Issues = "https://github.com/slfields/TkCurses/issues"

[project.scripts]
tkcurses-demo = "tkcurses.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tkcurses = ["py.typed"]

# The version is the latest tag, and past it the next one with a .devN that
# counts the commits since: 0.2.1.dev330+ge95dc81 on master after v0.2.0, so a
# merge is always newer than what came before it. A tagged commit is its tag
# alone. .git_archival.txt carries the same answer into a GitHub archive,
# which has no .git to ask.
[tool.setuptools_scm]

# ---------------------------------------------------------------- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
]
# Python warns on os.fork() from a process that has threads, every time, and
# pytest-xdist's workers have threads - so a parallel run of the tty suite emits
# one of these per child, 684 of them, which would bury any warning worth
# reading. Silenced with a reason rather than left to be scrolled past.
#
# The HAZARD it warns about is real and is addressed separately: the forked child
# makes only async-signal-safe syscalls before it execs, which
# tests/test_harness.py checks mechanically. The warning cannot tell a child that
# execs immediately from one that allocates, so it fires either way.
# TkCurses-kwv.
filterwarnings = [
    "ignore:This process .* is multi-threaded, use of fork.*:DeprecationWarning",
]
markers = [
    "tty: test drives a real pty and asserts on emulated terminal output",
    "slow: deselect with '-m \"not slow\"'",
]
# A hung curses call blocks on a pty read forever; fail the test instead of the suite.
timeout = 60

# ------------------------------------------------------------------ mypy ----
[tool.mypy]
python_version = "3.10"
files = ["src/tkcurses"]
# Everything strict mode turns on, because measuring it cost nothing - the
# library already passed with no errors at all. The individual flags below
# were the subset chosen at the time, and the rest have been available for
# free ever since: disallow_any_generics, disallow_untyped_calls,
# disallow_subclassing_any and extra_checks are what strict adds to them.
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# pyte ships no type stubs.
[[tool.mypy.overrides]]
module = "pyte.*"
ignore_missing_imports = true

# ------------------------------------------------------------------ ruff ----
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]
# Ruff 0.16 formats fenced Python inside Markdown. ARCHITECTURE.md's snippets
# are specification sketches - some deliberately incomplete, some aligned for
# reading rather than for Black - so they are not the formatter's business.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TC",     # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # line length is enforced by the formatter
]

[tool.ruff.lint.isort]
known-first-party = ["tkcurses"]

[tool.ruff.lint.per-file-ignores]
# The public API deliberately mirrors tkinter's names and re-export surface.
"src/tkcurses/__init__.py" = ["F401", "F403"]
# filedialog's whole contract is os.path: it takes and returns path *strings*,
# splits them with os.path.split, compares against os.sep, os.curdir and
# os.pardir, and hands the result to callers written against tkinter's own
# module. Rewriting it round pathlib would mean converting at every boundary
# to produce the same strings, which is more code for the same behaviour and
# a worse match for what the module is.
"src/tkcurses/filedialog.py" = ["PTH"]
# The same, for the tests that check its path handling: they have to speak
# the os.path the module speaks to be checking anything.
"tests/test_filedialog.py" = ["PTH"]
# And for the scenario that drives it, which passes the file dialogs the
# os.path strings they take.
"uat/scenario_30_choosers.py" = ["PTH"]
"tests/*" = ["ARG001", "ARG002", "ARG005"]
# Binding callbacks take an event whether or not they read it, and a trace
# takes three arguments it rarely wants all of. Same reason as the tests.
"uat/*" = ["ARG001", "ARG002", "ARG005"]

# -------------------------------------------------------------- coverage ----
[tool.coverage.run]
source = ["src/tkcurses"]
branch = true
omit = ["*/__main__.py"]
# The tty suite runs application code in forked child processes; without these
# every line exercised only through the harness reads as uncovered.
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
]
